<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ورود به سامانه دستیار هوشمند محک</title>
    <!-- اسکریپت مینی‌اپ بله / تلگرام جهت بستن خودکار پنجره -->
    <script src="https://tapi.bale.ai/miniapp.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Vazirmatn", Tahoma, sans-serif;
        }

        body {
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #0f172a;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 36px 28px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            text-align: center;
        }

        .brand-logo {
            width: 88px;
            height: 88px;
            border-radius: 16px;
            object-fit: contain;
            margin-bottom: 16px;
            border: none;
            box-shadow: none;
            padding: 0;
        }

        h1 {
            color: #0f172a;
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        p.subtitle {
            color: #64748b;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: right;
        }

        label {
            display: block;
            color: #334155;
            font-size: 12.5px;
            font-weight: 500;
            margin-bottom: 6px;
            margin-right: 2px;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            background: #f8fafc;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            color: #0f172a;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        select {
            cursor: pointer;
        }

        input:focus, select:focus {
            background: #ffffff;
            border-color: #ca8a04;
            box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.2);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background-color: #eab308;
            background-image: linear-gradient(135deg, #facc15 0%, #eab308 100%);
            border: 1px solid #ca8a04;
            border-radius: 10px;
            color: #1c1917;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(234, 179, 8, 0.25);
        }

        button:hover {
            background-image: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
            color: #ffffff;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status-box {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
        }

        .status-box.success {
            display: block;
            background: #f0fdf4;
            border: 1px solid #86efac;
            color: #166534;
        }

        .status-box.error {
            display: block;
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #991b1b;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- بارگذاری تصویر آیکون از مخزن -->
    <img src="icon.png" alt="Mahak Logo" class="brand-logo">

    <h1>دستیار XRM-GPT محک</h1>
    <p class="subtitle">برای استفاده از دستیار هوشمند XRM محک باید وارد شوید.</p>

    <div class="form-group">
        <label for="branch">شعبه</label>
        <select id="branch">
            <option value="TEH">تهران (TEH)</option>
            <option value="MHD">مشهد (MHD)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="username">نام کاربری</label>
        <input type="text" id="username" placeholder="مثال: a.ahmadi" dir="ltr" required>
    </div>

    <div class="form-group">
        <label for="password">رمز عبور</label>
        <input type="password" id="password" placeholder="••••••••" dir="ltr" required>
    </div>

    <button id="submitBtn" onclick="handleLogin()">ورود به سیستم</button>

    <div id="statusBox" class="status-box"></div>
</div>

<script>
    // تشخیص شیء WebApp در بله (یا تلگرام در صورت استفاده مشترک)
    const webApp = (window.Bale && window.Bale.WebApp) 
        ? window.Bale.WebApp 
        : (window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null);

    if (webApp) {
        webApp.ready();
        webApp.expand();
    }

    const urlParams = new URLSearchParams(window.location.search);
    
    // دریافت chat_id از URL یا به صورت خودکار از اطلاعات کاربر در مینی‌اپ بله
    const chatId = urlParams.get('chat_id') || (webApp?.initDataUnsafe?.user?.id ? String(webApp.initDataUnsafe.user.id) : '');
    const message_id = urlParams.get('message_id') || '';
    const platform = (urlParams.get('platform') || (window.Bale ? 'bale' : '');

    async function handleLogin() {
        const branch = document.getElementById('branch').value;
        const rawUsername = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const btn = document.getElementById('submitBtn');
        const statusBox = document.getElementById('statusBox');

        if (!rawUsername || !password) {
            showStatus('لطفاً تمامی فیلدها را کامل وارد کنید.', 'error');
            return;
        }

        const formattedUsername = `${branch}\\${rawUsername}`;

        // استفاده از URLSearchParams برای جلوگیری از ارسال درخواست Preflight (OPTIONS)
        const formBody = new URLSearchParams({
            platform: platform,
            chat_id: chatId,
            username: formattedUsername,
            password: password,
            message_id: message_id
        });

        btn.disabled = true;
        btn.innerText = 'در حال بررسی...';
        statusBox.className = 'status-box';

        const N8N_WEBHOOK_URL = 'https://automation.mahaksoft.com/webhook/logincheck';

        try {
            const response = await fetch(N8N_WEBHOOK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
                },
                body: formBody.toString()
            });
        
            let data = {};
            try {
                data = await response.json();
            } catch (e) {
                data = { message: 'پاسخ نامعتبر از سرور دریافت شد.' };
            }
        
            if (response.ok && data.status === 'success') {
                showStatus('ورود با موفقیت انجام شد. در حال بازگشت...', 'success');
                setTimeout(() => {
                    if (webApp) {
                        webApp.close(); // بستن خودکار مینی‌اپ در بله
                    } else {
                        window.close();
                    }
                }, 1500);
            } else {
                const errorMsg = data.message || 'نام کاربری یا رمز عبور اشتباه است (کد ' + response.status + ')';
                showStatus(errorMsg, 'error');
                btn.disabled = false;
                btn.innerText = 'ورود به سیستم';
            }
        } catch (err) {
            console.error('Fetch error:', err);
            showStatus('خطا در برقراری ارتباط با سرور: ' + (err.message || 'CORS / Network Error'), 'error');
            btn.disabled = false;
            btn.innerText = 'ورود به سیستم';
        }
    }

    function showStatus(text, type) {
        const statusBox = document.getElementById('statusBox');
        statusBox.innerText = text;
        statusBox.className = `status-box ${type}`;
    }
</script>

</body>
</html>
